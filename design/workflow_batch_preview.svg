<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="810" viewBox="0 0 1500 810" role="img" aria-labelledby="title desc">
<title id="title">批量任务工作流预览</title>
<desc id="desc">上下两条独立的任务轨道：批量岗位采集和批量会话监测。配置值来自当前项目设置。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:26px;font-weight:700;fill:#263A55}.subtitle{font-size:14px;fill:#697F9B}.lane-title{font-size:19px;font-weight:700;fill:#294969}.lane-note{font-size:13px;fill:#657D98}.card-title{font-size:16px;font-weight:700;fill:#334A65}.card-detail{font-size:12px;fill:#6E839A}.planned{font-size:11px;fill:#9076C4}.bridge{font-size:13px;fill:#5D7391}.footer{font-size:12px;fill:#7387A0}</style>
<rect x="1" y="1" width="1498" height="808" rx="18" fill="#FFFFFF" stroke="#DAE5F0"/>
<text class="title" x="36" y="49">批量任务工作流预览</text>
<text class="subtitle" x="36" y="77">每个节点按单条岗位或会话处理；任务在设定范围内重复执行，并汇总结果。</text>
<rect x="24" y="107" width="1452" height="380" rx="16" fill="#F6FAFF" stroke="#DFEAF6"/>
<text class="lane-title" x="42" y="139">采集任务 · 批量岗位</text>
<text class="lane-note" x="1450" y="139" text-anchor="end">本轮岗位上限：不限</text>
<text class="lane-note" x="42" y="231">JS 持续采集</text>
<g><rect x="190" y="185" width="190" height="102" rx="13" fill="#FFFFFF" stroke="#C8DCF2" stroke-width="1.5"/><text class="card-title" x="206" y="228">获取岗位</text><text class="card-detail" x="206" y="257">推荐流 · 1 组期望 · 每组 1 页</text></g>
<g><rect x="430" y="185" width="210" height="102" rx="13" fill="#FFF9F0" stroke="#E8CDA8" stroke-width="1.5"/><text class="card-title" x="446" y="228">逐岗位抓取与预筛</text><text class="card-detail" x="446" y="257">未通过则跳过</text></g>
<line x1="380" y1="236" x2="423" y2="236" stroke="#8DAACB" stroke-width="2"/><path d="M 421 231 L 430 236 L 421 241 Z" fill="#8DAACB"/>
<g><rect x="700" y="185" width="220" height="102" rx="13" fill="#FFFFFF" stroke="#C8DCF2" stroke-width="1.5"/><text class="card-title" x="716" y="228">继续抓取下一条</text><text class="card-detail" x="716" y="257">直到达到本轮上限</text></g>
<line x1="640" y1="236" x2="693" y2="236" stroke="#8DAACB" stroke-width="2"/><path d="M 691 231 L 700 236 L 691 241 Z" fill="#8DAACB"/>
<line x1="810" y1="185" x2="810" y2="165" stroke="#8DAACB" stroke-width="2"/>
<line x1="810" y1="165" x2="535" y2="165" stroke="#8DAACB" stroke-width="2"/>
<line x1="535" y1="165" x2="535" y2="185" stroke="#8DAACB" stroke-width="2"/>
<path d="M 530 177 L 535 185 L 540 177 Z" fill="#8DAACB"/>
<text class="lane-note" x="673" y="158" text-anchor="middle">继续下一条</text>
<rect x="970" y="185" width="466" height="102" rx="13" fill="#E9F3FF" stroke="#C8DCF2"/>
<text class="card-title" x="990" y="224">JS 抓取与 AI 评分同时进行</text>
<text class="card-detail" x="990" y="253">预筛通过即提交评分，浏览器继续抓取下一条</text>
<text class="lane-note" x="42" y="390">并发评分</text>
<line x1="535" y1="287" x2="535" y2="334" stroke="#8DAACB" stroke-width="2"/>
<path d="M 530 333 L 535 342 L 540 333 Z" fill="#8DAACB"/>
<text class="lane-note" x="558" y="321">预筛通过</text>
<g><rect x="430" y="342" width="210" height="102" rx="13" fill="#FFFFFF" stroke="#C8DCF2" stroke-width="1.5"/><text class="card-title" x="446" y="385">评分任务</text><text class="card-detail" x="446" y="414">最多 100 路并发</text></g>
<g><rect x="690" y="342" width="210" height="102" rx="13" fill="#F0FAF5" stroke="#B6DDC7" stroke-width="1.5"/><text class="card-title" x="706" y="385">评分结果入库</text><text class="card-detail" x="706" y="414">达标 ≥ 71 分</text></g>
<line x1="640" y1="393" x2="683" y2="393" stroke="#8DAACB" stroke-width="2"/><path d="M 681 388 L 690 393 L 681 398 Z" fill="#8DAACB"/>
<g><rect x="950" y="342" width="210" height="102" rx="13" fill="#FFFFFF" stroke="#C8DCF2" stroke-width="1.5"/><text class="card-title" x="966" y="385">准备招呼语</text><text class="card-detail" x="966" y="414">达标后 AI 生成</text></g>
<line x1="900" y1="393" x2="943" y2="393" stroke="#8DAACB" stroke-width="2"/><path d="M 941 388 L 950 393 L 941 398 Z" fill="#8DAACB"/>
<g><rect x="1210" y="342" width="210" height="102" rx="13" fill="#F5F1FF" stroke="#D7C9F2" stroke-width="1.5"/><text class="card-title" x="1226" y="385">人工确认发送</text><text class="card-detail" x="1226" y="414">发送成功形成会话</text></g>
<line x1="1160" y1="393" x2="1203" y2="393" stroke="#8DAACB" stroke-width="2"/><path d="M 1201 388 L 1210 393 L 1201 398 Z" fill="#8DAACB"/>
<text class="lane-note" x="42" y="469">每条通过预筛的岗位独立进入任务池；AI 请求无需等待 JS 采集完成。</text>
<line x1="24" y1="514" x2="1476" y2="514" stroke="#D9E4F0" stroke-dasharray="6 6"/>
<text class="bridge" x="750" y="508" text-anchor="middle">发送成功可形成会话；监测任务独立启动，也会扫描岗位池外的会话</text>
<rect x="24" y="534" width="1452" height="220" rx="16" fill="#F8FBFD" stroke="#DFEAF0"/>
<text class="lane-title" x="42" y="568">监测任务 · 批量会话</text>
<text class="lane-note" x="1450" y="568" text-anchor="end">每轮独立扫描</text>
<g><rect x="42" y="592" width="224" height="102" rx="13" fill="#FFFFFF" stroke="#C8DCF2" stroke-width="1.5"/><text class="card-title" x="58" y="635">扫描仅沟通会话</text><text class="card-detail" x="58" y="664">最近活动 4 天</text></g>
<g><rect x="325" y="592" width="224" height="102" rx="13" fill="#FFFFFF" stroke="#C8DCF2" stroke-width="1.5"/><text class="card-title" x="341" y="635">逐会话读取</text><text class="card-detail" x="341" y="664">每条最近 10 条消息</text></g>
<line x1="266" y1="643" x2="318" y2="643" stroke="#8DAACB" stroke-width="2"/><path d="M 316 638 L 325 643 L 316 648 Z" fill="#8DAACB"/>
<g><rect x="608" y="592" width="224" height="102" rx="13" fill="#FFF9F0" stroke="#E8CDA8" stroke-width="1.5"/><text class="card-title" x="624" y="635">判断会话进展</text><text class="card-detail" x="624" y="664">池内进展 / 池外岗位</text></g>
<line x1="549" y1="643" x2="601" y2="643" stroke="#8DAACB" stroke-width="2"/><path d="M 599 638 L 608 643 L 599 648 Z" fill="#8DAACB"/>
<g><rect x="891" y="592" width="224" height="102" rx="13" fill="#F5F1FF" stroke="#D7C9F2" stroke-width="1.5" stroke-dasharray="6 5"/><text class="planned" x="1102" y="611" text-anchor="end">规划</text><text class="card-title" x="907" y="635">审核后处理</text><text class="card-detail" x="907" y="664">追问 / 附件 / 礼貌回复</text></g>
<line x1="832" y1="643" x2="884" y2="643" stroke="#8DAACB" stroke-width="2"/><path d="M 882 638 L 891 643 L 882 648 Z" fill="#8DAACB"/>
<g><rect x="1174" y="592" width="224" height="102" rx="13" fill="#F0FAF5" stroke="#B6DDC7" stroke-width="1.5"/><text class="card-title" x="1190" y="635">回写进度</text><text class="card-detail" x="1190" y="664">会话与岗位状态</text></g>
<line x1="1115" y1="643" x2="1167" y2="643" stroke="#8DAACB" stroke-width="2"/><path d="M 1165 638 L 1174 643 L 1165 648 Z" fill="#8DAACB"/>
<text class="lane-note" x="42" y="732">逐会话处理直到扫描范围结束；再次扫描同一会话时更新进展。</text>
<text class="footer" x="36" y="785">图中数值来自当前配置；虚线节点表示尚未接入的后续动作。此图只预览工作方式，不启动任务。</text>
</svg>
