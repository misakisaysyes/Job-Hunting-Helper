<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="580" viewBox="0 0 1360 580" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">01 找岗位</title>
<desc id="diagram-desc">从 BOSS 获取岗位，预筛后按需评分；低分岗位可由用户决定是否继续。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91A3B9"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.canvas{fill:#FFFFFF;stroke:#DCE6F1;stroke-width:1.5}.heading{font-size:26px;font-weight:700;fill:#24344E}.subheading{font-size:14px;fill:#70829B}.node-title{font-size:17px;font-weight:700;fill:#2F425F}.node-subtitle{font-size:13px;fill:#60748F}.edge-label{font-size:12px;fill:#64748B}.legend{font-size:12px;fill:#7D8DA3}</style>
<rect class="canvas" x="1" y="1" width="1358" height="578" rx="18"/>
<text class="heading" x="42" y="48">01 找岗位</text>
<text class="subheading" x="42" y="73">从 BOSS 获取岗位，预筛后按需评分；低分岗位可由用户决定是否继续。</text>
<g class="edges">
<line x1="215" y1="160" x2="255" y2="160" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="255,160 246.0,165.0 246.0,155.0" fill="#91A3B9"/>
<line x1="420" y1="160" x2="460" y2="160" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="460,160 451.0,165.0 451.0,155.0" fill="#91A3B9"/>
<line x1="625" y1="160" x2="665" y2="160" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="665,160 656.0,165.0 656.0,155.0" fill="#91A3B9"/>
<line x1="830" y1="160" x2="870" y2="160" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="870,160 861.0,165.0 861.0,155.0" fill="#91A3B9"/>
<text x="850" y="147" text-anchor="middle" class="edge-label">开启</text>
<line x1="1035" y1="160" x2="1075" y2="160" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="1075,160 1066.0,165.0 1066.0,155.0" fill="#91A3B9"/>
<line x1="542" y1="190" x2="542" y2="300" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="542,300 537.0,291.0 547.0,291.0" fill="#91A3B9"/>
<text x="556" y="252" text-anchor="middle" class="edge-label">否</text>
<line x1="747" y1="190" x2="747" y2="300" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="747,300 742.0,291.0 752.0,291.0" fill="#91A3B9"/>
<text x="768" y="252" text-anchor="middle" class="edge-label">关闭</text>
<line x1="952" y1="190" x2="952" y2="300" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="952,300 947.0,291.0 957.0,291.0" fill="#91A3B9"/>
<text x="974" y="252" text-anchor="middle" class="edge-label">失败</text>
<line x1="1157" y1="190" x2="1157" y2="252" stroke="#91A3B9" stroke-width="2.4"/>
<line x1="1157" y1="252" x2="1110" y2="252" stroke="#91A3B9" stroke-width="2.4"/>
<line x1="1110" y1="252" x2="1110" y2="300" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="1110,300 1105.0,291.0 1115.0,291.0" fill="#91A3B9"/>
<text x="1075" y="240" text-anchor="middle" class="edge-label">低于门槛</text>
<line x1="1157" y1="252" x2="1270" y2="252" stroke="#91A3B9" stroke-width="2.4"/>
<line x1="1270" y1="252" x2="1270" y2="300" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="1270,300 1265.0,291.0 1275.0,291.0" fill="#91A3B9"/>
<text x="1250" y="240" text-anchor="middle" class="edge-label">达标</text>
<line x1="1110" y1="380" x2="1110" y2="430" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="1110,430 1105.0,421.0 1115.0,421.0" fill="#91A3B9"/>
<line x1="1180" y1="470" x2="1200" y2="470" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="1200,470 1191.0,475.0 1191.0,465.0" fill="#91A3B9"/>
<line x1="1270" y1="380" x2="1270" y2="430" stroke="#91A3B9" stroke-width="2.4"/>
<polygon points="1270,430 1265.0,421.0 1275.0,421.0" fill="#91A3B9"/>
</g>
<g class="nodes">
<g id="F1" data-config-node="F1">
<title>F1 BOSS 岗位；推荐流 / 搜索流</title>
<rect x="50" y="110" width="165" height="80" rx="14" fill="#F3F7FC" stroke="#8093AB" stroke-width="2"/>
<text x="132.5" y="146.5" text-anchor="middle" class="node-title">BOSS 岗位</text>
<text x="132.5" y="169.5" text-anchor="middle" class="node-subtitle">推荐流 / 搜索流</text>
</g>
<g id="F2" data-config-node="F2">
<title>F2 抓取岗位；页数 · 岗位上限</title>
<rect x="255" y="110" width="165" height="80" rx="14" fill="#EAF3FF" stroke="#4686D9" stroke-width="2"/>
<text x="337.5" y="146.5" text-anchor="middle" class="node-title">抓取岗位</text>
<text x="337.5" y="169.5" text-anchor="middle" class="node-subtitle">页数 · 岗位上限</text>
</g>
<g id="F3" data-config-node="F3">
<title>F3 预筛通过？；学历 · 年限 · 薪资</title>
<rect x="460" y="110" width="165" height="80" rx="14" fill="#FFF4E8" stroke="#D89541" stroke-width="2"/>
<text x="542.5" y="146.5" text-anchor="middle" class="node-title">预筛通过？</text>
<text x="542.5" y="169.5" text-anchor="middle" class="node-subtitle">学历 · 年限 · 薪资</text>
</g>
<g id="F4" data-config-node="F4">
<title>F4 启用 AI 评分？；开关 · 简历文本</title>
<rect x="665" y="110" width="165" height="80" rx="14" fill="#FFF4E8" stroke="#D89541" stroke-width="2"/>
<text x="747.5" y="146.5" text-anchor="middle" class="node-title">启用 AI 评分？</text>
<text x="747.5" y="169.5" text-anchor="middle" class="node-subtitle">开关 · 简历文本</text>
</g>
<g id="AI" data-config-node="AI">
<title>AI AI 评分；重试后失败会标记</title>
<rect x="870" y="110" width="165" height="80" rx="14" fill="#EAF3FF" stroke="#4686D9" stroke-width="2"/>
<text x="952.5" y="146.5" text-anchor="middle" class="node-title">AI 评分</text>
<text x="952.5" y="169.5" text-anchor="middle" class="node-subtitle">重试后失败会标记</text>
</g>
<g id="F5" data-config-node="F5">
<title>F5 达到门槛？；默认 71 分</title>
<rect x="1075" y="110" width="165" height="80" rx="14" fill="#FFF4E8" stroke="#D89541" stroke-width="2"/>
<text x="1157.5" y="146.5" text-anchor="middle" class="node-title">达到门槛？</text>
<text x="1157.5" y="169.5" text-anchor="middle" class="node-subtitle">默认 71 分</text>
</g>
<g id="F3-no" data-config-node="F3-no">
<title>F3-no 不入库；预筛未通过</title>
<rect x="460" y="300" width="165" height="80" rx="14" fill="#F3F5F8" stroke="#A5B0BD" stroke-width="2"/>
<text x="542.5" y="336.5" text-anchor="middle" class="node-title">不入库</text>
<text x="542.5" y="359.5" text-anchor="middle" class="node-subtitle">预筛未通过</text>
</g>
<g id="F4-no" data-config-node="F4-no">
<title>F4-no 已评分；无 AI 分数 → 打招呼</title>
<rect x="665" y="300" width="165" height="80" rx="14" fill="#EAF8F0" stroke="#51A878" stroke-width="2"/>
<text x="747.5" y="336.5" text-anchor="middle" class="node-title">已评分</text>
<text x="747.5" y="359.5" text-anchor="middle" class="node-subtitle">无 AI 分数 → 打招呼</text>
</g>
<g id="AI-failed" data-config-node="AI-failed">
<title>AI-failed 评分失败；重试耗尽</title>
<rect x="870" y="300" width="165" height="80" rx="14" fill="#F3F5F8" stroke="#A5B0BD" stroke-width="2"/>
<text x="952.5" y="336.5" text-anchor="middle" class="node-title">评分失败</text>
<text x="952.5" y="359.5" text-anchor="middle" class="node-subtitle">重试耗尽</text>
</g>
<g id="F5-low" data-config-node="F5-low">
<title>F5-low 已过滤；低于门槛</title>
<rect x="1040" y="300" width="140" height="80" rx="14" fill="#F3F5F8" stroke="#A5B0BD" stroke-width="2"/>
<text x="1110.0" y="336.5" text-anchor="middle" class="node-title">已过滤</text>
<text x="1110.0" y="359.5" text-anchor="middle" class="node-subtitle">低于门槛</text>
</g>
<g id="F5-pass" data-config-node="F5-pass">
<title>F5-pass 已评分；达到门槛</title>
<rect x="1200" y="300" width="140" height="80" rx="14" fill="#EAF8F0" stroke="#51A878" stroke-width="2"/>
<text x="1270.0" y="336.5" text-anchor="middle" class="node-title">已评分</text>
<text x="1270.0" y="359.5" text-anchor="middle" class="node-subtitle">达到门槛</text>
</g>
<g id="F6" data-config-node="F6">
<title>F6 仍去招呼？；用户手动选择</title>
<rect x="1040" y="430" width="140" height="80" rx="14" fill="#F2EEFF" stroke="#8D75CB" stroke-width="2"/>
<text x="1110.0" y="466.5" text-anchor="middle" class="node-title">仍去招呼？</text>
<text x="1110.0" y="489.5" text-anchor="middle" class="node-subtitle">用户手动选择</text>
</g>
<g id="F7" data-config-node="F7">
<title>F7 打招呼；进入下一段流程</title>
<rect x="1200" y="430" width="140" height="80" rx="14" fill="#EAF8F0" stroke="#51A878" stroke-width="2"/>
<text x="1270.0" y="466.5" text-anchor="middle" class="node-title">打招呼</text>
<text x="1270.0" y="489.5" text-anchor="middle" class="node-subtitle">进入下一段流程</text>
</g>
</g>
<text class="legend" x="42" y="556">蓝色：动作　橙色：判断　绿色：结果　紫色：人工选择　虚线：待实现</text>
</svg>
