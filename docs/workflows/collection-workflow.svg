<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 140" width="964" height="140" role="img" aria-labelledby="collection-title collection-description"><title id="collection-title">采集工作流</title><desc id="collection-description">获取岗位 → 预筛 → AI评分（可选） → 生成招呼 → 发送招呼</desc><style>
svg { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.node-surface { fill:#f5f9ff; stroke:#c4d9f1; stroke-width:1.25; }
.node-title { fill:#26364d; font-size:16px; font-weight:650; }
.node-subtitle { fill:#71829b; font-size:11px; }
.node-number { fill:#829ab6; font-size:10px; font-weight:600; }
.connector { fill:none; stroke:#9fb4cd; stroke-width:1.5; }
.arrow-tip { fill:#9fb4cd; }
</style><defs><marker id="collection-arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path class="arrow-tip" d="M 0 0 L 8 3.5 L 0 7 Z"/></marker></defs><path class="connector" d="M 176 70 H 210" marker-end="url(#collection-arrow)"/><path class="connector" d="M 368 70 H 402" marker-end="url(#collection-arrow)"/><path class="connector" d="M 560 70 H 594" marker-end="url(#collection-arrow)"/><path class="connector" d="M 752 70 H 786" marker-end="url(#collection-arrow)"/><g class="workflow-step" id="node-fetch" data-node-id="fetch"><title>获取岗位 · 推荐流 / 搜索流</title><rect class="node-surface" x="22" y="20" width="152" height="100" rx="11"/><text class="node-number" x="35" y="39">01</text><text class="node-title" x="98" y="65" text-anchor="middle">获取岗位</text><text class="node-subtitle" x="98" y="86" text-anchor="middle"><tspan x="98" dy="0">推荐流 / 搜索流</tspan></text></g><g class="workflow-step" id="node-filter" data-node-id="filter"><title>预筛 · 按求职条件筛选</title><rect class="node-surface" x="214" y="20" width="152" height="100" rx="11"/><text class="node-number" x="227" y="39">02</text><text class="node-title" x="290" y="65" text-anchor="middle">预筛</text><text class="node-subtitle" x="290" y="86" text-anchor="middle"><tspan x="290" dy="0">按求职条件筛选</tspan></text></g><g class="workflow-step" id="node-score" data-node-id="score"><title>AI评分（可选） · 结合简历评估匹配度</title><rect class="node-surface" x="406" y="20" width="152" height="100" rx="11"/><text class="node-number" x="419" y="39">03</text><text class="node-title" x="482" y="65" text-anchor="middle">AI评分（可选）</text><text class="node-subtitle" x="482" y="86" text-anchor="middle"><tspan x="482" dy="0">结合简历评估匹配度</tspan></text></g><g class="workflow-step" id="node-greeting" data-node-id="greeting"><title>生成招呼 · AI 生成 / 固定模板
均可手动编辑</title><rect class="node-surface" x="598" y="20" width="152" height="100" rx="11"/><text class="node-number" x="611" y="39">04</text><text class="node-title" x="674" y="65" text-anchor="middle">生成招呼</text><text class="node-subtitle" x="674" y="86" text-anchor="middle"><tspan x="674" dy="0">AI 生成 / 固定模板</tspan><tspan x="674" dy="16">均可手动编辑</tspan></text></g><g class="workflow-step" id="node-send" data-node-id="send"><title>发送招呼 · 人工确认后发送</title><rect class="node-surface" x="790" y="20" width="152" height="100" rx="11"/><text class="node-number" x="803" y="39">05</text><text class="node-title" x="866" y="65" text-anchor="middle">发送招呼</text><text class="node-subtitle" x="866" y="86" text-anchor="middle"><tspan x="866" dy="0">人工确认后发送</tspan></text></g></svg>